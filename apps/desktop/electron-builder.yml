# electron-builder 패키징 설정 (골격).
# 실제 배포 빌드(.dmg/.exe/AppImage 산출)는 현재 범위가 아니며, 패키징 도입 시
# devDependencies에 electron-builder를 추가하고 dist 스크립트를 연결한다.
# 아이콘은 BI 앱 아이콘을 Absolute Ink(#000000) 판으로 바꾼 assets/app-icon-ink.svg를 1024px로 변환한 assets/icon.png를 사용한다. .icns·.ico는 electron-builder가 이 PNG에서 만든다.
appId: com.scalable-monorepo-starter.desktop
productName: Desktop
directories:
  output: release/build
  buildResources: assets
files:
  - out/**
  - package.json
mac:
  target: dmg
  icon: assets/icon.png
win:
  target: nsis
  icon: assets/icon.png
linux:
  target: AppImage
  icon: assets/icon.png
